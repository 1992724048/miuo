name: ui
description: "系统工具箱子"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dynamic_color: ^2.1.0
  flutter_material_design_icons: ^3.1.0+7447
  window_manager: ^0.5.1
  flex_color_scheme: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/imgs/
    - assets/fonts/
    - assets/icons/
    - assets/sounds/
    - assets/fonts/HarmonyOS_Sans_SC_Regular.ttf

flutter_assets_generator:
  enable: true
  output_dir: /
  output_filename: assets
  class_name: Assets
  auto_detection: true
  auto_add_dependencies: true
  style: robust
  leaf_type: class
  name_style: camel
  package_parameter_enabled: true
  named_with_parent: true
  path_ignore: [ ]